services:
  postgres:
    image: postgres:16
    container_name: banking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bank_user
      POSTGRES_PASSWORD: bank_password
      POSTGRES_DB: banking
    ports:
      - "5432:5432"
    volumes:
      - banking_pgdata:/var/lib/postgresql/data

volumes:
  banking_pgdata: